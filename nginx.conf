server {
    listen 80;
    listen 5174;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /admin {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
