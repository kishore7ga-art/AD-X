server {
    listen 80;
    listen 5174;
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve assets correctly regardless of whether request path is /admin/assets/ or /assets/
    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # SPA routing fallback for /admin and root
    location / {
        try_files $uri $uri/ /index.html;
    }
}
