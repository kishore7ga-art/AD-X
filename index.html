<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The panel is not something to be found by searching for it — the same
      stance as the `robots` metadata on xite-F's /admin route.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Outfit is the geometric sans the panel is drawn in. It is a progressive
      enhancement: the stack in styles.css falls back to the platform UI font,
      so a blocked or offline fonts.googleapis.com costs the shape of the
      letters and nothing else.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Super Admin — XITE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
